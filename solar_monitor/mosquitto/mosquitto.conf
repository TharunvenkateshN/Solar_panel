# Minimal local-only Mosquitto config for the demo.
# Run from this folder:   "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
listener 1883 127.0.0.1
allow_anonymous true

# Optional: lets MQTT Explorer / browser clients (MQTT over WebSockets) watch the topics.
listener 9001 127.0.0.1
protocol websockets
